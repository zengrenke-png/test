<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StudyFlow：離線學習任務規劃器">
  <title>StudyFlow｜學習任務規劃器</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e3e7ef;--primary:#3457d5;--primary2:#eaf0ff;--good:#16835b;--goodbg:#e6f7ef;--warn:#9a5b00;--warnbg:#fff4df;--danger:#b33737;--shadow:0 12px 32px rgba(35,48,80,.08);--radius:16px}
    *{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden} body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.5}
    button,input,select{font:inherit} button{cursor:pointer;border:0}.app{max-width:1240px;width:100%;min-width:0;margin:auto;padding:24px 18px 48px}.topbar{width:100%;min-width:0;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#3457d5,#6e83ff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 8px 20px #3457d544}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);font-weight:800}.topbar h1{font-size:27px;margin:2px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:#eef1f7;color:var(--ink);font-weight:700}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--primary);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-header h2{font-size:17px;margin:0}.panel-body{padding:18px 20px}.stack{display:grid;gap:14px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800;color:#4f5a70}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d7dce7;border-radius:9px;background:#fff;color:var(--ink);min-width:0}.field input:focus,.field select:focus{outline:3px solid #3457d522;border-color:var(--primary)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section-title{font-size:13px;font-weight:800;color:#4f5a70;margin:4px 0 -4px}.divider{height:1px;background:var(--line);margin:4px 0}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day-toggle{position:relative}.day-toggle input{position:absolute;opacity:0}.day-toggle span{display:block;text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);font-weight:700}.day-toggle input:checked+span{background:var(--primary2);border-color:#9db0ff;color:var(--primary)}.time-row{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:8px}.time-row .btn{margin-bottom:0}.hint{font-size:12px;color:var(--muted);margin:0}.tasks-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px}.tasks-toolbar select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.task-list{display:grid;gap:9px}.task-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:grid;gap:10px;background:#fff}.task-main{display:flex;align-items:flex-start;gap:10px}.task-check{width:20px;height:20px;accent-color:var(--primary);margin-top:2px;flex:none}.task-title{font-weight:800}.task-title.done{text-decoration:line-through;color:var(--muted)}.task-meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:12px}.tag{background:#f0f3f9;border-radius:999px;padding:3px 8px}.task-actions{display:flex;gap:6px;justify-content:flex-end}.empty{padding:25px;border:1px dashed #cfd5e2;color:var(--muted);border-radius:11px;text-align:center}.main{display:grid;gap:18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px}.metric{border-radius:12px;background:#f6f8fc;padding:12px}.metric strong{display:block;font-size:22px;line-height:1.2}.metric span{font-size:12px;color:var(--muted)}.metric.alert{background:var(--warnbg);color:var(--warn)}.metric.success{background:var(--goodbg);color:var(--good)}.schedule-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.schedule-toolbar .grow{flex:1}.schedule-toolbar select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.week-list{display:grid;gap:12px}.day-card{border:1px solid var(--line);border-radius:13px;overflow:hidden}.day-head{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;background:#f8f9fc;border-bottom:1px solid var(--line)}.day-head strong{font-size:14px}.day-head span{font-size:12px;color:var(--muted)}.slot-list{padding:8px}.slot{display:grid;grid-template-columns:116px 1fr auto;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #eef0f5}.slot:last-child{border-bottom:0}.slot-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--primary)}.slot-title{font-weight:700}.slot-sub{font-size:12px;color:var(--muted)}.slot-badge{font-size:11px;background:var(--primary2);color:var(--primary);border-radius:999px;padding:4px 8px;white-space:nowrap}.slot.open{background:#fbfcff}.slot.open .slot-title{color:var(--muted);font-weight:600}.notice{padding:11px 13px;border-radius:10px;font-size:13px}.notice.info{background:#eef3ff;color:#334b9b}.notice.warn{background:var(--warnbg);color:var(--warn)}.notice.error{background:#fff0f0;color:var(--danger)}.notice.good{background:var(--goodbg);color:var(--good)}.modal-backdrop{position:fixed;inset:0;background:#17203366;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px #17203344}.modal .panel-header{padding:16px 20px}.modal form{padding:18px 20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:880px){.layout{grid-template-columns:1fr}.side-panel{order:2}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.app{padding:14px 10px 36px}.topbar{align-items:flex-start;flex-direction:column}.topbar h1{font-size:23px}.top-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.top-actions .btn{min-width:0;padding-left:5px;padding-right:5px}.panel-header,.panel-body{padding-left:14px;padding-right:14px}.summary{padding:12px 14px;gap:8px}.metric strong{font-size:19px}.slot{grid-template-columns:1fr auto;gap:3px 8px}.slot-time{grid-column:1/-1;font-size:12px}.slot-badge{grid-column:2;grid-row:2}.slot-title{grid-column:1}.days{gap:3px}.day-toggle span{font-size:11px;padding:6px 1px}.two{grid-template-columns:1fr}.time-row{grid-template-columns:1fr 1fr}.time-row .btn{grid-column:1/-1}}@media(max-width:650px){.app{width:390px;max-width:390px}.layout,.panel,.main,.side-panel{width:100%;max-width:100%}.top-actions{grid-template-columns:1fr}.top-actions .btn{width:100%}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">S</div><div><div class="eyebrow">Offline study planner</div><h1>StudyFlow</h1></div></div>
    <div class="top-actions"><button class="btn ghost" id="exportBtn">匯出備份</button><button class="btn ghost" id="importBtn">匯入 JSON</button><input id="fileInput" class="hidden" type="file" accept="application/json,.json"><button class="btn primary" id="rescheduleBtn">重新排程</button></div>
  </header>
  <div id="globalNotice" class="notice info hidden" role="status"></div>
  <div class="layout">
    <aside class="side-panel panel">
      <div class="panel-header"><h2>排程設定</h2><button class="btn small ghost" id="resetSettingsBtn">重設</button></div>
      <div class="panel-body stack">
        <div class="two"><div class="field"><label for="startDate">排程起始日</label><input id="startDate" type="date"></div><div class="field"><label for="rangeDays">排程天數</label><input id="rangeDays" type="number" min="1" max="31" step="1"></div></div>
        <div class="section-title">每週可用日</div><div class="days" id="dayToggles"></div>
        <div class="section-title">每日可用時段</div><div id="timeWindows" class="stack"></div><button class="btn small ghost" id="addWindowBtn">＋新增時段</button>
        <div class="divider"></div><p class="hint">排程會跳過現在以前的時間、截止時間以後的時間與已完成任務；修改任務或設定後會立即重新計算。</p>
      </div>
    </aside>
    <section class="main">
      <section class="panel"><div class="panel-header"><h2>我的任務</h2><button class="btn primary small" id="addTaskBtn">＋新增任務</button></div><div class="panel-body"><div class="tasks-toolbar"><span class="hint">用科目篩選（我的改進）</span><select id="subjectFilter"><option value="all">全部科目</option></select><span class="grow"></span><span id="taskCount" class="hint"></span></div><div id="taskList" class="task-list"></div></div></section>
      <section class="panel"><div class="panel-header"><div><h2>週計劃</h2><p class="hint" id="scheduleStatus"></p></div><div class="schedule-toolbar"><select id="scheduleFilter"><option value="all">全部科目</option></select></div></div><div class="summary" id="summary"></div><div class="panel-body"><div id="scheduleNotices"></div><div id="weekList" class="week-list"></div></div></section>
    </section>
  </div>
</main>

<div id="taskModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle"><div class="modal"><div class="panel-header"><h2 id="taskModalTitle">新增任務</h2><button class="btn small ghost" data-close="taskModal">關閉</button></div><form id="taskForm"><input id="taskId" type="hidden"><div class="stack"><div class="field"><label for="taskTitle">名稱</label><input id="taskTitle" required maxlength="100" placeholder="例如：複習函數單元"></div><div class="two"><div class="field"><label for="taskSubject">科目</label><input id="taskSubject" required maxlength="40" placeholder="數學"></div><div class="field"><label for="taskHours">估計工時（小時）</label><input id="taskHours" type="number" required min="0.5" step="0.5" value="1"></div></div><div class="field"><label for="taskDue">截止日期時間</label><input id="taskDue" type="datetime-local" required></div><label class="hint"><input id="taskCompleted" type="checkbox"> 已完成</label></div><div class="modal-actions"><button type="button" class="btn ghost" data-close="taskModal">取消</button><button class="btn primary" type="submit">儲存任務</button></div></form></div></div>
<div id="importModal" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal"><div class="panel-header"><h2>匯入備份</h2><button class="btn small ghost" data-close="importModal">關閉</button></div><div class="panel-body stack"><p class="hint">選擇 JSON 後會先驗證格式；錯誤檔案不會覆蓋目前資料。</p><div id="importMessage" class="notice info">尚未選擇檔案</div><button class="btn primary" id="chooseImportBtn">選擇 JSON 檔</button></div></div></div>

<script>
(() => {
  'use strict';
  const DAY_NAMES=['日','一','二','三','四','五','六'];
  const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const dateKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
  const dateTimeLocal=d=>{const x=new Date(d);return `${dateKey(x)}T${pad(x.getHours())}:${pad(x.getMinutes())}`};
  const parseLocal=s=>{const [a,b]=s.split('T');const [y,m,d]=a.split('-').map(Number);const [h,mi]=b.split(':').map(Number);return new Date(y,m-1,d,h,mi)};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  const defaultStart=dateKey(addDays(now,0));
  const state={version:1,tasks:[],settings:{startDate:defaultStart,rangeDays:7,days:[1,2,3,4,5],windows:[{start:'09:00',end:'12:00'},{start:'14:00',end:'18:00'}]},lastSchedule:null};
  const $=id=>document.getElementById(id);
  const clone=o=>JSON.parse(JSON.stringify(o));
  const showNotice=(text,type='info')=>{const el=$('globalNotice');el.textContent=text;el.className=`notice ${type}`;el.classList.remove('hidden');clearTimeout(showNotice.timer);showNotice.timer=setTimeout(()=>el.classList.add('hidden'),5000)};
  const fmtDate=d=>new Intl.DateTimeFormat('zh-Hant-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(d);
  const fmtTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const subjectValues=()=>[...new Set(state.tasks.map(t=>t.subject).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  function renderDays(){ $('dayToggles').innerHTML=DAY_NAMES.map((n,i)=>`<label class="day-toggle"><input type="checkbox" value="${i}" ${state.settings.days.includes(i)?'checked':''}><span>${n}</span></label>`).join('');$('dayToggles').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{state.settings.days=[...$('dayToggles').querySelectorAll('input:checked')].map(x=>Number(x.value));scheduleAndRender()})); }
  function renderSettings(){ $('startDate').value=state.settings.startDate;$('rangeDays').value=state.settings.rangeDays;renderDays();renderWindows(); }
  function renderWindows(){const wrap=$('timeWindows');wrap.innerHTML=state.settings.windows.map((w,i)=>`<div class="time-row"><div class="field"><label>開始</label><input data-window="start" data-index="${i}" type="time" value="${w.start}"></div><div class="field"><label>結束</label><input data-window="end" data-index="${i}" type="time" value="${w.end}"></div><button class="btn small danger" data-remove-window="${i}" ${state.settings.windows.length<=1?'disabled':''}>刪除</button></div>`).join('');wrap.querySelectorAll('input').forEach(input=>input.addEventListener('change',e=>{const i=Number(e.target.dataset.index);state.settings.windows[i][e.target.dataset.window]=e.target.value;scheduleAndRender()}));wrap.querySelectorAll('[data-remove-window]').forEach(b=>b.addEventListener('click',()=>{state.settings.windows.splice(Number(b.dataset.removeWindow),1);renderWindows();scheduleAndRender()}));}
  function populateFilters(){const subjects=subjectValues();for(const id of ['subjectFilter','scheduleFilter']){const el=$(id),old=el.value;el.innerHTML='<option value="all">全部科目</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(subjects.includes(old))el.value=old;}}
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function renderTasks(){populateFilters();const f=$('subjectFilter').value;const list=state.tasks.filter(t=>f==='all'||t.subject===f).sort((a,b)=>new Date(a.due)-new Date(b.due));$('taskCount').textContent=`${list.length} 項`;if(!list.length){$('taskList').innerHTML='<div class="empty">還沒有符合條件的任務，先新增一項吧。</div>';return} $('taskList').innerHTML=list.map(t=>`<article class="task-card"><div class="task-main"><input class="task-check" type="checkbox" data-complete="${t.id}" ${t.completed?'checked':''} aria-label="完成 ${esc(t.title)}"><div><div class="task-title ${t.completed?'done':''}">${esc(t.title)}</div><div class="task-meta"><span class="tag">${esc(t.subject)}</span><span>截止 ${fmtDate(parseLocal(t.due))} ${fmtTime(parseLocal(t.due))}</span><span>${t.hours} 小時</span>${t.completed?'<span class="tag" style="background:#e6f7ef;color:#16835b">已完成</span>':''}</div></div></div><div class="task-actions"><button class="btn small ghost" data-edit="${t.id}">編輯</button><button class="btn small danger" data-delete="${t.id}">刪除</button></div></article>`).join('');$('taskList').querySelectorAll('[data-complete]').forEach(c=>c.addEventListener('change',()=>{const t=state.tasks.find(x=>x.id===c.dataset.complete);t.completed=c.checked;scheduleAndRender()}));$('taskList').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openTask(b.dataset.edit)));$('taskList').querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('確定刪除這項任務？')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.delete);scheduleAndRender();showNotice('任務已刪除','good')}}));}
  function buildIntervals(){const start=parseLocal(state.settings.startDate+'T00:00');const n=Math.max(1,Math.min(31,Number(state.settings.rangeDays)||7));const result=[];for(let i=0;i<n;i++){const day=addDays(start,i);if(!state.settings.days.includes(day.getDay()))continue;for(const w of state.settings.windows){if(!w.start||!w.end||w.end<=w.start)continue;const from=parseLocal(dateKey(day)+'T'+w.start),to=parseLocal(dateKey(day)+'T'+w.end);const floor=new Date();const actualFrom=from<floor?floor:from;if(actualFrom<to)result.push({from:actualFrom,to,taskId:null})}}return result.sort((a,b)=>a.from-b.from)}
  function schedule(){const intervals=buildIntervals();const tasks=state.tasks.filter(t=>!t.completed).sort((a,b)=>new Date(a.due)-new Date(b.due));const scheduled=[];const remaining={};for(const t of tasks){let left=Math.round(Number(t.hours)*2)/2;remaining[t.id]=left;const due=parseLocal(t.due);for(const slot of intervals){if(left<=0)break;if(slot.taskId||slot.from>=due||slot.to<=new Date(state.settings.startDate+'T00:00'))continue;const usableEnd=slot.to<due?slot.to:due;const available=(usableEnd-slot.from)/3600000;const amount=Math.min(left,available);if(amount<=0)continue;const from=new Date(slot.from),to=new Date(from.getTime()+amount*3600000);scheduled.push({taskId:t.id,from,to,title:t.title,subject:t.subject});slot.from=to;left=Math.round((left-amount)*2)/2}remaining[t.id]=left}return {scheduled,remaining,intervals,generatedAt:new Date().toISOString()}}
  function renderSchedule(){const result=state.lastSchedule||schedule();state.lastSchedule=result;const filter=$('scheduleFilter').value;const visibleTasks=state.tasks.filter(t=>filter==='all'||t.subject===filter);const byDay={};for(const item of result.scheduled){if(filter!=='all'&&!visibleTasks.some(t=>t.id===item.taskId))continue;const k=dateKey(item.from);(byDay[k]??=[]).push(item)}const unscheduled=Object.entries(result.remaining).filter(([id,h])=>h>0).map(([id,h])=>({task:state.tasks.find(t=>t.id===id),hours:h})).filter(x=>x.task&&(filter==='all'||x.task.subject===filter));const planned=result.scheduled.filter(x=>filter==='all'||visibleTasks.some(t=>t.id===x.taskId));const total=state.tasks.filter(t=>!t.completed&&(filter==='all'||t.subject===filter)).reduce((s,t)=>s+Number(t.hours),0);const plannedHours=planned.reduce((s,x)=>s+(x.to-x.from)/3600000,0);$('summary').innerHTML=`<div class="metric"><strong>${plannedHours.toFixed(1)}h</strong><span>已排時數</span></div><div class="metric"><strong>${total.toFixed(1)}h</strong><span>未完成需求</span></div><div class="metric ${unscheduled.length?'alert':'success'}"><strong>${unscheduled.reduce((s,x)=>s+x.hours,0).toFixed(1)}h</strong><span>${unscheduled.length?'尚欠時數':'尚欠時數'}</span></div><div class="metric"><strong>${planned.length}</strong><span>計劃段落</span></div>`;$('scheduleStatus').textContent=`更新於 ${new Intl.DateTimeFormat('zh-Hant-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date(result.generatedAt))}`;let notices='';if(unscheduled.length)notices+=`<div class="notice warn">時間不足：${unscheduled.map(x=>`「${esc(x.task.title)}」欠 ${x.hours.toFixed(1)} 小時`).join('、')}。目前沒有顯示「全部排好」。</div>`;else if(total>0)notices='<div class="notice good">所有未完成任務都已排入截止時間前的可用時段。</div>';if(!state.settings.days.length)notices='<div class="notice warn">目前沒有開啟任何可用日，請在左側設定。</div>';if(state.settings.windows.some(w=>w.end<=w.start))notices+='<div class="notice error">有時段的結束時間早於或等於開始時間，該時段已跳過。</div>';$('scheduleNotices').innerHTML=notices;const start=parseLocal(state.settings.startDate+'T00:00');const days=[];for(let i=0;i<Number(state.settings.rangeDays);i++){const d=addDays(start,i),k=dateKey(d);if(state.settings.days.includes(d.getDay()))days.push({d,k,items:byDay[k]||[]})}if(!days.length){$('weekList').innerHTML='<div class="empty">這個範圍沒有開啟的可用日。</div>';return}$('weekList').innerHTML=days.map(({d,items})=>`<article class="day-card"><div class="day-head"><strong>${fmtDate(d)}</strong><span>${items.length?`${items.length} 段已排程`:'沒有排程'}</span></div><div class="slot-list">${items.length?items.sort((a,b)=>a.from-b.from).map(x=>`<div class="slot"><div class="slot-time">${fmtTime(x.from)}–${fmtTime(x.to)}</div><div><div class="slot-title">${esc(x.title)}</div><div class="slot-sub">${esc(x.subject)} · 截止 ${fmtDate(parseLocal(state.tasks.find(t=>t.id===x.taskId).due))} ${fmtTime(parseLocal(state.tasks.find(t=>t.id===x.taskId).due))}</div></div><span class="slot-badge">${((x.to-x.from)/3600000).toFixed(1)}h</span></div>`).join(''):'<div class="slot open"><div class="slot-title">可用時段尚未分配任務</div></div>'}</div></article>`).join('')}
  function scheduleAndRender(){state.lastSchedule=schedule();renderTasks();renderSchedule()}
  function openTask(id){const t=state.tasks.find(x=>x.id===id);$('taskModalTitle').textContent=t?'編輯任務':'新增任務';$('taskId').value=t?.id||'';$('taskTitle').value=t?.title||'';$('taskSubject').value=t?.subject||'';$('taskDue').value=t?.due||dateTimeLocal(addDays(new Date(),1));$('taskHours').value=t?.hours||1;$('taskCompleted').checked=!!t?.completed;$('taskModal').classList.remove('hidden');setTimeout(()=>$('taskTitle').focus(),0)}
  function saveTask(e){e.preventDefault();const title=$('taskTitle').value.trim(),subject=$('taskSubject').value.trim(),due=$('taskDue').value,hours=Number($('taskHours').value);if(!title||!subject||!due||!Number.isFinite(hours)||hours<=0||hours%0.5!==0){showNotice('請確認必填欄位與 0.5 小時的工時格式。','error');return}const id=$('taskId').value||crypto.randomUUID();const data={id,title,subject,due,hours,completed:$('taskCompleted').checked};const index=state.tasks.findIndex(t=>t.id===id);if(index>=0)state.tasks[index]=data;else state.tasks.push(data);$('taskModal').classList.add('hidden');scheduleAndRender();showNotice(index>=0?'任務已更新':'任務已新增','good')}
  function validBackup(data){if(!data||data.version!==1||!Array.isArray(data.tasks)||!data.settings||typeof data.settings.startDate!=='string'||!Number.isInteger(data.settings.rangeDays)||!Array.isArray(data.settings.days)||!Array.isArray(data.settings.windows))throw new Error('缺少必要欄位');for(const t of data.tasks){if(!t.id||typeof t.title!=='string'||typeof t.subject!=='string'||typeof t.due!=='string'||typeof t.hours!=='number'||t.hours<=0||t.hours%0.5!==0||typeof t.completed!=='boolean')throw new Error('任務欄位格式錯誤')}for(const w of data.settings.windows){if(typeof w.start!=='string'||typeof w.end!=='string')throw new Error('時段欄位格式錯誤')}return true}
  function exportBackup(){const payload={version:1,exportedAt:new Date().toISOString(),tasks:clone(state.tasks),settings:clone(state.settings)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='studyflow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);showNotice('備份已匯出','good')}
  function importJsonFile(file){const reader=new FileReader();reader.onload=()=>{const before=clone(state);try{const data=JSON.parse(reader.result);validBackup(data);state.tasks=data.tasks;state.settings=data.settings;state.lastSchedule=null;renderSettings();scheduleAndRender();$('importMessage').className='notice good';$('importMessage').textContent='匯入成功，資料已還原。';showNotice('備份已匯入','good')}catch(err){Object.assign(state,before);$('importMessage').className='notice error';$('importMessage').textContent=`匯入失敗：${err.message}。原有資料保持不變。`;showNotice('匯入失敗，原有資料未改動','error')}};reader.readAsText(file)}
  $('addTaskBtn').addEventListener('click',()=>openTask(''));$('taskForm').addEventListener('submit',saveTask);$('rescheduleBtn').addEventListener('click',()=>{scheduleAndRender();showNotice('已重新排程','good')});$('exportBtn').addEventListener('click',exportBackup);$('importBtn').addEventListener('click',()=>$('importModal').classList.remove('hidden'));$('chooseImportBtn').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',e=>{if(e.target.files[0])importJsonFile(e.target.files[0])});$('addWindowBtn').addEventListener('click',()=>{state.settings.windows.push({start:'19:00',end:'20:00'});renderWindows();scheduleAndRender()});$('startDate').addEventListener('change',e=>{state.settings.startDate=e.target.value;scheduleAndRender()});$('rangeDays').addEventListener('change',e=>{state.settings.rangeDays=Math.max(1,Math.min(31,Number(e.target.value)||7));e.target.value=state.settings.rangeDays;scheduleAndRender()});$('subjectFilter').addEventListener('change',renderTasks);$('scheduleFilter').addEventListener('change',renderSchedule);$('resetSettingsBtn').addEventListener('click',()=>{state.settings={startDate:defaultStart,rangeDays:7,days:[1,2,3,4,5],windows:[{start:'09:00',end:'12:00'},{start:'14:00',end:'18:00'}]};renderSettings();scheduleAndRender();showNotice('設定已重設','good')});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).classList.add('hidden')));document.querySelectorAll('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.add('hidden')}));
  const demoToday=new Date();
  state.tasks=[{id:'demo-math',title:'複習函數與圖形',subject:'數學',due:dateTimeLocal(addDays(demoToday,2)).slice(0,11)+'18:00',hours:2,completed:false},{id:'demo-vocab',title:'整理 Unit 1 單字',subject:'英文',due:dateTimeLocal(addDays(demoToday,3)).slice(0,11)+'20:00',hours:1.5,completed:false},{id:'demo-speaking',title:'聽說練習錄音',subject:'英文',due:dateTimeLocal(addDays(demoToday,5)).slice(0,11)+'21:00',hours:1,completed:false}];
  // 測試 fixture 只由網址明確啟用，方便重跑與截圖；一般開啟仍是三項去識別化示例任務。
  const fixture=new URLSearchParams(location.search).get('fixture');
  if(fixture){const tomorrow=dateKey(addDays(demoToday,1));state.settings={startDate:tomorrow,rangeDays:1,days:[new Date(tomorrow+'T00:00').getDay()],windows:[{start:fixture==='reschedule'?'10:00':'09:00',end:fixture==='complete'?'11:00':'11:00'}]};state.tasks=[{id:'fixture-task',title:'測試任務（三小時）',subject:'測試',due:tomorrow+'T23:59',hours:3,completed:fixture==='complete'}];}
  renderSettings();scheduleAndRender();
})();
</script>
</body>
